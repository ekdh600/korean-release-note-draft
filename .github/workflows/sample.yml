name: Run Korean release note sample
on: workflow_dispatch
permissions:
  contents: read
jobs:
  sample:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - id: note
        uses: ./
      - name: Compare output with the fictional note
        env:
          DRAFT_FILE: ${{ steps.note.outputs.draft }}
        run: cmp sample/release-note.md "$DRAFT_FILE"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: korean-release-note-sample
          path: ${{ steps.note.outputs.draft }}
          if-no-files-found: error
          retention-days: 7
